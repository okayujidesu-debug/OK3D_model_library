<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK3D モデルライブラリ</title>
<style>
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f7;
    color: #222;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.8em;
    margin-bottom: 0.2em;
  }
  p.lead {
    color: #555;
    margin-bottom: 2em;
  }
  .model-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .model-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .model-name {
    font-size: 1.05em;
    font-weight: 600;
  }
  .model-date {
    font-size: 0.85em;
    color: #888;
    margin-top: 2px;
  }
  .download-btn {
    background: #2ea44f;
    color: #fff;
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 0.95em;
    white-space: nowrap;
  }
  .download-btn:hover {
    background: #2c974b;
  }
  footer {
    margin-top: 3em;
    font-size: 0.8em;
    color: #999;
  }
</style>
</head>
<body>
<div class="container">
  <h1>OK3D モデルライブラリ</h1>
  <p class="lead">Blenderで作成した3Dモデルを公開しています。各モデルをダウンロードして、Blenderで開いてご利用ください。</p>

  <div class="model-list">
    <div class="model-card">
      <div>
        <div class="model-name">点群処理の例_Simple.blend</div>
        <div class="model-date">2026-09-12 追加</div>
      </div>
      <a class="download-btn" href="点群処理の例_Simple.blend" download>ダウンロード</a>
    </div>
  </div>

  <footer>新しいモデルは順次追加していきます。</footer>
</div>
</body>
</html>
